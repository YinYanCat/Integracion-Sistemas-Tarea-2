
services:

  gateway:
    build:
      context: ./gateway
    ports: 
      - "8080:8080"
    environment:
      TOKEN: "token123"
      RATE_LIMIT: "5"
      RATE_WINDOW: "10"
    depends_on:
      - bff-web
      - servicio-stock
      - servicio-despacho
      - servicio-receta

  bff-web:
    build:
      # El Dockerfile genera los stubs gRPC desde contratos/stock.proto,
      # por eso necesita el contexto completo del repositorio.
      context: .
      dockerfile: bff_web/Dockerfile
    expose:
      - "8090"
    depends_on:
      - orquestador
      - servicio-stock
      - servicio-receta
      - servicio-despacho

  orquestador:
    build:
      # Igual que bff-web y stock: genera los stubs desde contratos/stock.proto.
      context: .
      dockerfile: orquestador/Dockerfile
    volumes:
      - saga_data:/data
    expose:
      - "8104"

  servicio-stock:
    build:
      # El Dockerfile genera los stubs gRPC desde contratos/stock.proto,
      # por eso necesita el contexto completo del repositorio.
      context: .
      dockerfile: stock/Dockerfile
    volumes:
      - stock_data:/data
    environment:
      STOCK_DB_PATH: /data/stock.db
      STOCK_GRPC_PORT: "8101"
    expose:
      - "8101"
    
  servicio-despacho:
    build:
      context: ./despacho
    volumes:
      - despacho_data:/data
    expose:
      - "8102"
    
  servicio-receta:
    build:
      context: ./receta
    volumes:
      - receta_data:/data
    expose:
      - "8103"


volumes:
  stock_data:
  despacho_data:
  receta_data:
  saga_data:
